name: "Build Resource Pack"
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      package: ${{ steps.info.outputs.package }}
      artifact: ${{ steps.info.outputs.artifact }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.2

      - name: Prepare environments
        id: info
        run: pixi run python build.py --info

      - name: Prepare build workspace
        run: pixi run python build.py --prepare

      - name: Make Optimized Pack
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: build/temp_packsquash.toml
          packsquash_version: latest

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: Optimized pack.zip

      - name: Rename Optimized Pack
        run: mv ${{ steps.info.outputs.output }} "${{ steps.info.outputs.package }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.artifact }}
          path: ${{ steps.info.outputs.package }}.zip
  publish-github:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Rename artifact
        run: mv ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.package }}.zip ${{ needs.build.outputs.name }}.zip
      - name: Create release
        uses: softprops/action-gh-release@v2.0.4
        with:
          draft: true
          name: "${{ needs.build.outputs.name }} v${{ needs.build.outputs.version }}"
          files: ${{ needs.build.outputs.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-ssh:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Prepare upload files
        run: |
          cp "${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.package }}.zip" "${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.name }}.zip"

      - name: Deploy to Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER || secrets.SSH_USER }}
          server: ${{ secrets.SFTP_HOST || secrets.SSH_HOST }}
          port: ${{ secrets.SFTP_PORT || secrets.SSH_PORT || 2222 }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SFTP_KEY }}
          password: ${{ secrets.SFTP_PASSWORD || secrets.SSH_PASSWORD }}
          local_path: '${{ steps.download.outputs.download-path }}/*'
          remote_path: ${{ secrets.SFTP_REMOTE_DIR || secrets.SSH_DIST || '/web' }}
          sftp_only: true
  publish-discord:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Discord Publish
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ secrets.DISCORD_THREAD_ID }}
          content: "Доступна новая версия: **${{ needs.build.outputs.name }} v${{ needs.build.outputs.version }}**"
          filename: "${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.package }}.zip"
  publish-gdrive:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Upload to Google Drive via Rclone
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          rclone copyto "${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.package }}.zip" "mydrive:${{ needs.build.outputs.name }}.zip" --drive-root-folder-id="${{ secrets.GDRIVE_FOLDER_ID }}"

